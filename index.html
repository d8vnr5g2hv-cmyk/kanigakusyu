/* ---- カテゴリー（科目 → カテゴリー → テーマ …） ---- */
function catsAll(){return cols('cat').slice().sort(function(a,b){return (a.o||0)-(b.o||0);});}
function catById(id){var a=cols('cat');for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function kids(p){p=p||'';return catsAll().filter(function(c){return (c.p||'')===p;});}
function roots(){return kids('');}
function anc(id){var o=[],c=catById(id),g=0;while(c&&g++<20){o.unshift(c);c=c.p?catById(c.p):null;}return o;}
function rootOf(id){var a=anc(id);return a[0]||null;}
function pathName(id,sep){if(!id)return '未登録';var a=anc(id);return a.length?a.map(function(c){return c.n;}).join(sep||' › '):'（削除したカテゴリー）';}
function leafName(id){if(!id)return '未登録';var c=catById(id);return c?c.n:'（削除したカテゴリー）';}
function isUnder(id,node){if(!node)return true;return anc(id).some(function(c){return c.id===node;});}
function childUnder(id,node){var a=anc(id);if(!a.length)return null;if(!node)return a[0];for(var i=0;i<a.length;i++)if(a[i].id===node)return a[i+1]||a[i];return null;}
function slotOf(c){if(!c)return 0;var sib=kids(c.p||''),i=-1;for(var k=0;k<sib.length;k++)if(sib[k].id===c.id){i=k;break;}return i>=0&&i<7?i+1:0;} // 色は7章まで。8章目以降は「その他」の灰色
function colorOfCat(id){return sc(slotOf(rootOf(id)));}
function catOpts(sel,blank){
  var h=blank?'<option value="">'+blank+'</option>':'';
  (function walk(p,dep){kids(p).forEach(function(c){h+='<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+new Array(dep+1).join('　')+esc(c.n)+'</option>';walk(c.id,dep+1);});})('',0);
  return h;
}
function firstCat(){var r=roots();if(!r.length)return '';var c=r[0];while(kids(c.id).length)c=kids(c.id)[0];return c.id;}

/* ---- 記録・期間 ---- */
function recs(){return rows('rec');}
function weekStart(s){var d=pd(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d);}
function monthEnd(s){var d=pd(s.slice(0,8)+'01');d.setMonth(d.getMonth()+1);d.setDate(0);return ymd(d);}
function periodRange(per){
  var t=today();
  if(per==='today')return [t,t];
  if(per==='week')return [weekStart(t),addD(weekStart(t),6)];
  if(per==='month')return [t.slice(0,8)+'01',monthEnd(t)];
  if(per==='year')return [t.slice(0,4)+'-01-01',t.slice(0,4)+'-12-31'];
  var f=recs().reduce(function(m,r){return r.d<m?r.d:m;},t);return [f,t];
}
function inR(r,a,b){return r.d>=a&&r.d<=b;}
function minutesIn(a,b,node){return sum(recs().filter(function(r){return inR(r,a,b)&&isUnder(r.cat,node);}),function(r){return r.m;});}
function byDayMap(){var o={};recs().forEach(function(r){o[r.d]=(o[r.d]||0)+(+r.m||0);});return o;}
function streaks(){
  var m=byDayMap(),t=today(),cur=0,d=m[t]?t:addD(t,-1);
  while(m[d]>0){cur++;d=addD(d,-1);}
  var ks=Object.keys(m).filter(function(k){return m[k]>0;}).sort(),best=0,run=0,prev='';
  ks.forEach(function(k){run=prev&&addD(prev,1)===k?run+1:1;best=Math.max(best,run);prev=k;});
  return {cur:cur,best:best,days:ks.length};
}
function uLabel(u){return u?u+'/5':'未評価';}

/* ---- 復習（忘却を考えた間隔） ---- */
var INT=[1,3,7,14,30,60];
function rvOf(cat){var a=cols('rv');for(var i=0;i<a.length;i++)if(a[i].id===cat)return a[i];return null;}
function dueList(){var t=today();return cols('rv').filter(function(r){return r.nx<=t&&catById(r.id);}).sort(function(a,b){return a.nx<b.nx?-1:1;});}
function ensureReview(pid,cat){
  if(!cat)return;
  var c=D&&D.meta.id===pid?cols('rv'):((LS.get('la_p_'+pid,{cols:{}}).cols||{}).rv||[]);
  if(c.some(function(r){return r.id===cat;}))return;
  putTo(pid,'rv',{id:cat,st:0,nx:addD(today(),1),last:today(),n:0});
}
function reviewDone(cat,res){ // res: 1=できた 0=まだ 2=そのまま
  var r=Object.assign({id:cat,st:0,n:0},rvOf(cat)||{});
  r.st=res===1?Math.min(r.st+1,INT.length-1):res===0?0:r.st;
  r.nx=addD(today(),INT[r.st]);r.last=today();r.n=(r.n||0)+1;
  put('rv',r);return r;
}
function putTo(pid,c,row){
  if(D&&D.meta.id===pid)return put(c,row);
  var ch=LS.get('la_p_'+pid,null);
  if(ch){var a=ch.cols[c]=ch.cols[c]||[],i=-1;for(var k=0;k<a.length;k++)if(a[k].id===row.id){i=k;break;}if(i>=0)a[i]=row;else a.push(row);LS.set('la_p_'+pid,ch);}
  Q.push({pid:pid,op:'put',c:c,row:row});LS.set('la_q',Q);setSync('saving');setTimeout(flush,300);
  return row;
}
function rowIn(pid,c,id){
  var a=D&&D.meta.id===pid?cols(c):((LS.get('la_p_'+pid,{cols:{}}).cols||{})[c]||[]);
  for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;
}

/* ---- 目標 ---- */
var GK={day:['1日の学習時間','分'],week:['1週間の学習時間','分'],wcat:['科目の週の学習時間','分'],quiz:['小テスト（週）','回'],rev:['復習（週）','テーマ'],book:['読書（月）','冊']};
function goalVal(k){var g=cols('goal').filter(function(x){return x.k===k;})[0];return g?+g.v:0;}
function goalCur(g){
  var t=today(),ws=weekStart(t),we=addD(ws,6);
  if(g.k==='day')return minutesIn(t,t);
  if(g.k==='week')return minutesIn(ws,we);
  if(g.k==='wcat')return minutesIn(ws,we,g.cat);
  if(g.k==='quiz')return uniq(rows('qr').filter(function(r){return r.d>=ws&&r.d<=we;}).map(function(r){return r.ss||r.id;})).length;
  if(g.k==='rev')return cols('rv').filter(function(r){return r.last>=ws&&r.n>0;}).length;
  if(g.k==='book')return cols('book').filter(function(b){return b.dn&&mon(b.dn)===mon(t);}).length;
  return 0;
}
function goalLabel(g){return g.k==='wcat'?leafName(g.cat)+'（週）':GK[g.k][0];}
function goalSuggest(g){
  if(g.k!=='week'&&g.k!=='wcat'&&g.k!=='day')return null;
  var ws=weekStart(today()),wk=[];
  for(var i=1;i<=4;i++){var a=addD(ws,-7*i);wk.push(minutesIn(a,addD(a,6),g.k==='wcat'?g.cat:''));}
  var has=wk.filter(function(x){return x>0;}).length;if(has<2)return null;
  var avg=sum(wk)/4,target=g.k==='day'?avg/7:avg;
  if(target>=g.v*.6)return null;
  var nv=Math.max(10,Math.round(target*1.2/10)*10);
  return nv<g.v?{avg:Math.round(target),nv:nv}:null;
}

function studyAlerts(){
  var t=today(),a7=addD(t,-6),r7=recs().filter(function(r){return r.d>=a7;}),tot=sum(r7,function(r){return r.m;}),out=[];
  var by={};r7.forEach(function(r){var c=rootOf(r.cat);if(c)by[c.id]=(by[c.id]||0)+(+r.m||0);});
  var ks=Object.keys(by);
  var bookMode=(function(){var c=cfgMode();return c&&c.m==='book';})(); // 本を順に読むときは、章の偏りや空白は自然なので出さない
  if(!bookMode&&ks.length>=1&&roots().length>=2&&tot>=60)ks.forEach(function(k){if(by[k]/tot>.7)out.push(['alert',leafName(k)+'が直近7日の'+pct(by[k],tot)+'%を占めています。ほかの科目も少し入れてみませんか。']);});
  var a14=addD(t,-13),u={};
  recs().filter(function(r){return r.d>=a14&&r.u;}).forEach(function(r){var c=rootOf(r.cat);if(!c)return;u[c.id]=u[c.id]||{m:0,u:0,n:0};u[c.id].m+=+r.m||0;u[c.id].u+=+r.u;u[c.id].n++;});
  Object.keys(u).forEach(function(k){var x=u[k];if(x.m>=60&&x.u/x.n<=2.5)out.push(['alert',leafName(k)+'は学習時間のわりに理解度が低めです。前提の知識や学び方を見直すタイミングかもしれません。']);});
  var a30=addD(t,-29),q={};
  rows('qr').filter(function(r){return r.d>=a30;}).forEach(function(r){var c=rootOf(r.cat);if(!c)return;q[c.id]=q[c.id]||{o:0,n:0};q[c.id].n++;if(r.ok)q[c.id].o++;});
  Object.keys(q).forEach(function(k){var x=q[k];if(x.n>=5&&x.o/x.n<.6)out.push(['alert',leafName(k)+'の小テスト正答率が'+pct(x.o,x.n)+'%です。基礎問題で確認してみましょう。']);});
  if(!bookMode)roots().forEach(function(c){var rr=recs().filter(function(r){return isUnder(r.cat,c.id);});if(rr.length){var last=rr.reduce(function(m,r){return r.d>m?r.d:m;},'');if(dd(last,t)>=10)out.push(['info',c.n+'は'+dd(last,t)+'日間学習していません。']);}});
  var due=dueList().length;if(due)out.push(['info','復習予定のテーマが'+due+'件あります。']);
  return out;
}

var PERS=[['today','今日'],['week','今週'],['month','今月'],['year','今年'],['all','全期間']];
function buckets(per,a,b){
  var o=[];
  if(per==='today'){o.push({k:a,l:'今日',a:a,b:a});return o;}
  if(per==='week'||per==='month'){for(var d=a;d<=b;d=addD(d,1))o.push({k:d,l:per==='week'?WD[pd(d).getDay()]:String(pd(d).getDate()),a:d,b:d});return o;}
  var s=a.slice(0,7),e=b.slice(0,7),y=+s.slice(0,4),m=+s.slice(5,7),g=0;
  while(g++<120){var k=y+'-'+p2(m);o.push({k:k,l:m+'月',a:k+'-01',b:monthEnd(k+'-01')});if(k>=e)break;m++;if(m>12){m=1;y++;}}
  return o;
}

function weekReport(off){

  var rs=recs().filter(function(r){return inR(r,ws,we);}),prs=recs().filter(function(r){return inR(r,pws,pwe);});
  var tot=sum(rs,function(r){return r.m;}),ptot=sum(prs,function(r){return r.m;}),days=uniq(rs.map(function(r){return r.d;})).length;
  var qr=rows('qr').filter(function(r){return inR(r,ws,we);}),qp=qr.length?pct(qr.filter(function(r){return r.ok;}).length,qr.length):null;
  var rv=cols('rv').filter(function(r){return r.last>=ws&&r.last<=we&&r.n>0;}).length;
  var h='<div class="tchips" style="margin-bottom:12px">'+[0,1,2,3].map(function(k){return '<button class="'+(off===k?'on':'')+'" data-a="wkSel" data-v="'+k+'">'+(k?k===1?'先週':k+'週前':'今週')+'</button>';}).join('')+'</div>';
  h+='<div class="hint" style="margin:0 4px 10px">'+fd(ws)+' 〜 '+fd(we)+'</div>';
  var df=tot-ptot;
  h+='<div class="tiles"><div class="tile"><div class="k">学習時間</div><div class="v">'+fm(tot)+'</div>'+cmpBadge(tot,ptot,'前の週より')+'</div><div class="tile"><div class="k">学習した日</div><div class="v">'+days+'<small>/ 7日</small></div></div><div class="tile"><div class="k">小テスト正答率</div><div class="v">'+(qp==null?'—':qp+'<small>%（'+qr.length+'問）</small>')+'</div></div><div class="tile"><div class="k">復習したテーマ</div><div class="v">'+rv+'<small>件</small></div></div></div>';
  if(!rs.length)return h+empty('chart','この週の記録はありません');
  var by={};rs.forEach(function(r){var c=rootOf(r.cat);if(!c)return;by[c.id]=by[c.id]||{c:c,m:0,p:0};by[c.id].m+=+r.m||0;});
  prs.forEach(function(r){var c=rootOf(r.cat);if(c&&by[c.id])by[c.id].p+=+r.m||0;});

  var th={};rs.filter(function(r){return r.u;}).forEach(function(r){th[r.cat]=th[r.cat]||{m:0,u:0,n:0};th[r.cat].m+=+r.m||0;th[r.cat].u+=+r.u;th[r.cat].n++;});
  var low=Object.keys(th).map(function(k){return {id:k,m:th[k].m,u:th[k].u/th[k].n};}).filter(function(x){return x.u<=2.5;}).sort(function(a,b){return a.u-b.u;}).slice(0,3);
  if(low.length)h+='<div class="sec">'+secH('理解度が低めのテーマ','自己評価')+'<div class="panel" style="padding:4px 16px">'+low.map(function(x){return '<div class="row"><span class="t">'+esc(pathName(x.id))+'</span><span class="a">'+(Math.round(x.u*10)/10)+'/5 <span class="s">'+fm(x.m)+'</span></span></div>';}).join('')+'</div></div>';
  var wg=cols('goal').filter(function(g){return g.k==='week'||g.k==='wcat';});
  if(wg.length)h+='<div class="sec">'+secH('週の目標')+'<div class="panel">'+wg.map(function(g){var c=minutesIn(ws,we,g.k==='wcat'?g.cat:'');return '<div class="bar" style="grid-template-columns:7.5em 1fr 3.4em;margin-bottom:6px"><span>'+esc(goalLabel(g))+'</span><div class="bar-t"><i style="width:'+Math.min(100,pct(c,g.v))+'%"></i></div><b>'+pct(c,g.v)+'%</b></div>';}).join('')+'</div></div>';

function lRoad(){
  var a=roadAll(),steps=uniq(a.map(function(r){return r.st;})),h='<div class="info">'+ico('map',18)+'<div>ロードマップは学習を助けるガイドです。興味のあるテーマから自由に進めてかまいません。</div></div>';
  if(!a.length)h+=empty('map','テーマがまだありません');
  steps.forEach(function(st){
    var it=a.filter(function(r){return r.st===st;}),done=it.filter(function(r){return r.s===3;}).length;
    h+='<div class="sec">'+secH(esc(st),done+'/'+it.length+' 理解済み')+'<div class="panel" style="padding:4px 16px">'+bar(pct(done,it.length)).replace('class="prog"','class="prog" style="margin:10px 0 2px"')+it.map(function(r){
      var miss=preMissing(r);
      return '<button class="row" data-a="roadOpen" data-id="'+r.id+'"><div style="min-width:0"><div class="t">'+esc(r.n)+'</div>'+(r.s===0&&miss.length?'<div class="s" style="color:var(--warn)">先に確認したい：'+esc(miss.map(function(x){return x.n;}).join('、'))+'</div>':'')+'</div><span class="chip'+(r.s===3?' ok':r.s===0?' gray':'')+'">'+RST[r.s]+'</span></button>';
    }).join('')+'</div></div>';
  });
  if(!ro())h+='<button class="addrow" data-a="roadEdit">'+ico('plus',18)+'テーマを追加</button>';
  return h;
}
A.roadOpen=function(b){
  var r=roadById(b.getAttribute('data-id'));if(!r)return;
  var miss=preMissing(r),mins=r.cat?minutesIn('0000-01-01','9999-12-31',r.cat):0;
  openSheet(r.n,'<p class="hint" style="margin-top:0">'+esc(r.st)+(r.cat?' ・ 関連：'+esc(pathName(r.cat))+'（'+fm(mins)+'）':'')+'</p>'+
    (r.pre&&r.pre.length?'<div class="'+(miss.length?'alert':'info')+'">'+ico(miss.length?'alert':'check',18)+'<div>前提：'+esc(r.pre.map(function(id){var x=roadById(id);return x?x.n+'（'+RST[x.s]+'）':'';}).filter(Boolean).join('、'))+'</div></div>':'')+
    (ro()?'<div class="chip">'+RST[r.s]+'</div>':fld('ステータス',seg('roS',RST.map(function(x,i){return [String(i),x];}),String(r.s),4))+
    '<button class="btn" data-a="roadSt" data-id="'+r.id+'">保存する</button><div class="btns" style="margin-top:8px"><button class="btn ghost" data-a="roadEdit" data-id="'+r.id+'">編集</button></div>'));
};
A.roadSt=function(b){var r=roadById(b.getAttribute('data-id'));put('road',Object.assign({},r,{s:+sv('roS')}));closeSheet(true);render(true);};

/* 小テスト */
function qAcc(cat){var a=rows('qr').filter(function(r){return isUnder(r.cat,cat);});return a.length?{p:pct(a.filter(function(r){return r.ok;}).length,a.length),n:a.length}:null;}
function lQuiz(){
  var qs=cols('qq'),groups=uniq(qs.map(function(q){return q.cat;})),h='';
  if(!ro())h+='<div class="acts" style="margin-bottom:14px"><button class="act main" data-a="quizStart" data-v="">'+ico('play',22)+'ランダムに5問</button><button class="act" data-a="qEdit">'+ico('plus',22)+'問題を作る</button></div>';
  var acc=rows('qr'),w=acc.filter(function(r){return r.d>=addD(today(),-29);});
  if(acc.length)h+='<div class="tiles"><div class="tile"><div class="k">直近30日の正答率</div><div class="v">'+(w.length?pct(w.filter(function(r){return r.ok;}).length,w.length)+'%':'—')+'</div></div><div class="tile"><div class="k">解いた問題</div><div class="v">'+acc.length+'<small>問</small></div></div></div>';
  if(!qs.length)return h+empty('quiz','問題はまだありません。学んだテーマごとに、自分で確認問題を作りましょう');
  groups.forEach(function(c){
    var l=qs.filter(function(q){return q.cat===c;}),a=qAcc(c);
    h+='<div class="sec">'+secH(esc(pathName(c)),(a?'正答率 '+a.p+'%':'未回答')+' ・ '+l.length+'問',!ro()?'<button data-a="quizStart" data-v="'+esc(c)+'">このテーマで解く</button>':'')+'<div class="panel" style="padding:4px 16px">'+l.map(function(q){
      var rs=rows('qr').filter(function(r){return r.qid===q.id;}),last=rs.sort(function(x,y){return x.d<y.d?1:-1;})[0];
      return '<button class="row" data-a="qEdit" data-id="'+q.id+'"><div class="t" style="font-weight:500">'+esc(q.q)+'</div><span class="chip'+(last?(last.ok?' ok':' warn'):' gray')+'">'+(last?(last.ok?'できた':'まだ'):'未')+'</span></button>';
    }).join('')+'</div></div>';
  });
  return h;
}

A.qSave=function(b){var id=b.getAttribute('data-id'),q=fv('qQ');if(!q){toast('問題を入力してください');return;}put('qq',Object.assign({},id?cols('qq').filter(function(x){return x.id===id;})[0]:{id:uid()},{cat:fv('qC'),q:q,a:fv('qA')}));closeSheet(true);render(true);toast('保存しました');};
A.qDel=function(b){if(!confirm('この問題を削除しますか？'))return;del('qq',b.getAttribute('data-id'));closeSheet(true);render(true);};
var QZ=null;
A.quizStart=function(b){
  var cat=b.getAttribute('data-v')||'',pool=cols('qq').filter(function(q){return !cat||isUnder(q.cat,cat);});
  if(b.getAttribute('data-due')){var due=dueList().map(function(r){return r.id;});pool=cols('qq').filter(function(q){return due.some(function(d){return isUnder(q.cat,d);});});}
  if(!pool.length){toast('問題がありません');return;}
  var qr=rows('qr'),t0=today();
  pool=pool.map(function(q){var rs=qr.filter(function(r){return r.qid===q.id;}).sort(function(a,b){return a.d<b.d?1:-1;}),l=rs[0];
    var w=!l?2:!l.ok?3:dd(l.d,t0)>=7?1.5:1;return {q:q,k:w+Math.random()};}).sort(function(a,b){return b.k-a.k;}).map(function(x){return x.q;}).slice(0,cat?10:5);
  QZ={list:pool,i:0,show:0,res:[],ss:uid()};quizSheet();
};
function quizSheet(){
  var q=QZ.list[QZ.i];
  if(!q){
    var ok=QZ.res.filter(function(r){return r.ok;}).length,by={};
    QZ.res.forEach(function(r){by[r.cat]=by[r.cat]||{o:0,n:0};by[r.cat].n++;if(r.ok)by[r.cat].o++;});
    Object.keys(by).forEach(function(c){var x=by[c],p=x.o/x.n;reviewDone(c,p>=.8?1:p<.6?0:2);});
    openSheet('結果','<div class="big" style="text-align:center">'+ok+'<small>/ '+QZ.res.length+'問</small></div>'+bar(pct(ok,QZ.res.length))+'<p class="hint" style="text-align:center">正答率 '+pct(ok,QZ.res.length)+'%。結果に合わせて、次の復習日を調整しました。</p><button class="btn" data-a="close">閉じる</button>');
    render(true);return;
  }
  openSheet('小テスト '+(QZ.i+1)+'/'+QZ.list.length,'<div class="small">'+esc(pathName(q.cat))+'</div><div style="font-size:18px;font-weight:700;margin:8px 0 16px;white-space:pre-wrap">'+esc(q.q)+'</div>'+
    (QZ.show?'<div class="info" style="white-space:pre-wrap">'+ico('check',18)+'<div>'+esc(q.a||'（答えが登録されていません）')+'</div></div><div class="btns"><button class="btn" data-a="qzAns" data-v="1">'+ico('check',18)+'できた</button><button class="btn ghost" data-a="qzAns" data-v="0">まだ</button></div>':'<button class="btn" data-a="qzShow">答えを見る</button>'));
}
A.qzShow=function(){QZ.show=1;quizSheet();};
A.qzAns=function(b){var q=QZ.list[QZ.i],ok=b.getAttribute('data-v')==='1';var r={id:uid(),d:today(),qid:q.id,cat:q.cat,ok:ok?1:0,ss:QZ.ss};put('qr',r);QZ.res.push(r);QZ.i++;QZ.show=0;quizSheet();};

/* 復習 */
function lRv(){
  var due=dueList(),all=cols('rv').filter(function(r){return catById(r.id);}).sort(function(a,b){return a.nx<b.nx?-1:1;}),h='';
  h+='<div class="info">'+ico('repeat',18)+'<div>学習したテーマは、翌日→3日後→7日後→14日後→30日後の順に復習を案内します。覚えていなければ間隔を短く戻します。</div></div>';
  h+='<div class="sec">'+secH('今日の復習',due.length+'件',due.length&&cols('qq').length&&!ro()?'<button data-a="quizStart" data-v="" data-due="1">問題で確認</button>':'')+(due.length?due.map(rvCard).join(''):empty('check','今日の復習はありません'))+'</div>';
  var later=all.filter(function(r){return r.nx>today();});
  if(later.length)h+='<div class="sec">'+secH('これからの予定')+'<div class="panel" style="padding:4px 16px">'+later.slice(0,30).map(function(r){return '<div class="row"><span class="t">'+esc(pathName(r.id))+'</span><span class="s">'+fd(r.nx)+'（'+dd(today(),r.nx)+'日後）</span></div>';}).join('')+'</div></div>';
  return h;
}
function rvCard(r){
  var a=qAcc(r.id),hasQ=cols('qq').some(function(q){return isUnder(q.cat,r.id);});
  return '<div class="card"><div class="card-top"><span class="card-name">'+esc(pathName(r.id))+'</span><span class="chip">'+(r.nx<today()?dd(r.nx,today())+'日遅れ':'今日')+'</span></div><div class="card-sub">復習'+(r.n||0)+'回目 ・ 次の間隔 '+INT[Math.min(r.st+1,INT.length-1)]+'日'+(a?' ・ 正答率 '+a.p+'%':'')+'</div>'+
    (ro()?'':'<div class="btns" style="margin-top:10px">'+(hasQ?'<button class="btn sm" data-a="quizStart" data-v="'+esc(r.id)+'">問題で確認</button>':'')+'<button class="btn sm ghost" data-a="rvMark" data-id="'+esc(r.id)+'" data-v="1">覚えていた</button><button class="btn sm ghost" data-a="rvMark" data-id="'+esc(r.id)+'" data-v="0">あやしい</button></div>')+'</div>';
}
A.rvMark=function(b){var r=reviewDone(b.getAttribute('data-id'),+b.getAttribute('data-v'));render(true);toast('次の復習は'+fd(r.nx)+'です');};

  if(!bs.length)h+=empty('book','教材はまだありません。本を買ったら登録しましょう');
  bs.forEach(function(b){
    var p=b.pg?pct(b.rd||0,b.pg):0,m=sum(recs().filter(function(r){return r.book===b.id;}),function(r){return r.m;});
    h+='<button class="card" data-a="bookEdit" data-id="'+b.id+'"><div class="card-top"><span class="card-name">'+esc(b.t)+'</span>'+(b.dn?'<span class="chip ok">読み終えた</span>':'')+'</div><div class="card-sub">'+esc([b.au,b.cat?pathName(b.cat):''].filter(Boolean).join(' ・ '))+'</div>'+
      '<div style="margin-top:10px">'+bar(p)+'</div><div class="card-row" style="justify-content:space-between"><span>読んだ割合 '+p+'%（'+(b.rd||0)+'/'+(b.pg||'?')+'ページ）</span><span>理解度 '+uLabel(b.u)+' ・ '+fm(m)+'</span></div>'+(b.memo?'<div class="small" style="margin-top:6px;white-space:pre-wrap">'+esc(b.memo)+'</div>':'')+'</button>';
  });

  return h;
}

/* 知識ノート（検索・テーマ別の振り返り） */
function lNote(){
  var h='<div class="panel" style="padding:12px"><div style="display:flex;gap:8px;align-items:center">'+ico('search',20)+'<input data-i="noteQ" value="'+esc(V.q)+'" placeholder="例：相対性理論" style="border:0;background:transparent;padding:6px 0"></div></div><div id="noteList">'+noteListHtml()+'</div>';
  if(!ro())h+='<button class="addrow" data-a="knEdit">'+ico('plus',18)+'ノートを書く</button>';
  return h;
}
function noteListHtml(){
  var q=V.q.toLowerCase(),themes={};
  function add(cat,k,o){if(!cat)return;themes[cat]=themes[cat]||{kn:[],rec:[],qq:[]};themes[cat][k].push(o);}
  cols('kn').forEach(function(n){add(n.cat,'kn',n);});
  recs().filter(function(r){return r.memo||r.what;}).forEach(function(r){add(r.cat,'rec',r);});
  cols('qq').forEach(function(x){add(x.cat,'qq',x);});
  var ids=Object.keys(themes).filter(function(c){
    if(!q)return true;var t=themes[c];
    return pathName(c).toLowerCase().indexOf(q)>=0||t.kn.some(function(n){return (n.t+n.b).toLowerCase().indexOf(q)>=0;})||t.rec.some(function(r){return ((r.memo||'')+(r.what||'')+r.d).toLowerCase().indexOf(q)>=0;})||t.qq.some(function(x){return (x.q+x.a).toLowerCase().indexOf(q)>=0;});
  }).sort(function(a,b){return pathName(a)<pathName(b)?-1:1;});
  if(!ids.length)return empty('note',q?'見つかりませんでした':'テーマごとのメモがここにまとまります');
  return ids.map(function(c){
    var t=themes[c],m=minutesIn('0000-01-01','9999-12-31',c),a=qAcc(c),rv=rvOf(c),bks=uniq(recs().filter(function(r){return r.cat===c&&r.book;}).map(function(r){return r.book;})).map(function(id){var b=cols('book').filter(function(x){return x.id===id;})[0];return b?b.t:'';}).filter(Boolean);
    return '<div class="card"><div class="card-name">'+esc(pathName(c))+'</div><div class="card-sub">学習 '+fm(m)+(a?' ・ 正答率 '+a.p+'%':'')+(rv?' ・ 次の復習 '+fd(rv.nx):'')+(bks.length?' ・ 教材：'+esc(bks.join('、')):'')+'</div>'+
      t.kn.map(function(n){return '<button class="row" data-a="knEdit" data-id="'+n.id+'"><div style="min-width:0"><div class="t">'+esc(n.t||'ノート')+'</div><div class="s" style="white-space:pre-wrap">'+esc(n.b)+'</div></div></button>';}).join('')+
      t.rec.slice(0,6).map(function(r){return '<div class="row"><div style="min-width:0"><div class="s">'+fd(r.d)+' ・ '+fm(r.m)+' ・ 理解度 '+uLabel(r.u)+'</div><div style="font-size:13px;white-space:pre-wrap">'+esc([r.what,r.memo].filter(Boolean).join('\n'))+'</div></div></div>';}).join('')+
      (t.qq.length?'<div class="small" style="margin-top:6px">確認問題 '+t.qq.length+'問</div>':'')+'</div>';
  }).join('');
}

/* 目標 */
function lGoal(){
  var gl=cols('goal'),h='<div class="info">'+ico('target',18)+'<div>目標に届かない週が続いたら、失敗ではなく「続けられる目標」に調整しましょう。</div></div>';
  if(!gl.length)h+=empty('target','目標はまだありません');

function buildTree(spec){
  var out=[],o=0;
  (function walk(arr,p){arr.forEach(function(it){var n=typeof it==='string'?it:it[0],id='c'+(++o);out.push({id:id,n:n,p:p,o:o});if(typeof it!=='string')walk(it[1],id);});})(spec,'');
  return out;
}

/* =====================================================
   iPhoneの通知（Web Push）
   ・ホーム画面に追加したアプリ（iOS 16.4以降）で使える
   ・通知の暗号化と署名はこの端末で行い、GASは時刻になったら送るだけ
   ===================================================== */
var te=window.TextEncoder?new TextEncoder():null;
function pushOk(){return !!(window.isSecureContext&&'serviceWorker' in navigator&&'PushManager' in window&&window.Notification&&window.crypto&&crypto.subtle&&te);}
function b64u(a){a=new Uint8Array(a);var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64(a){a=new Uint8Array(a);var s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function ub64u(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function cat(){var n=0,i,a=[].slice.call(arguments);for(i=0;i<a.length;i++)n+=a[i].length;var o=new Uint8Array(n),p=0;for(i=0;i<a.length;i++){o.set(a[i],p);p+=a[i].length;}return o;}
function hmac(key,data){return crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']).then(function(k){return crypto.subtle.sign('HMAC',k,data);}).then(function(b){return new Uint8Array(b);});}
function hkdf(salt,ikm,info,len){return hmac(salt,ikm).then(function(prk){return hmac(prk,cat(info,new Uint8Array([1])));}).then(function(t){return t.slice(0,len);});}
// この端末の送信者キー（VAPID）
function vapid(){
  var s=LS.get('la_vapid',null);
  if(s)return crypto.subtle.importKey('jwk',s.jwk,{name:'ECDSA',namedCurve:'P-256'},false,['sign']).then(function(k){return {pub:s.pub,key:k};});
  return crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']).then(function(kp){
    return Promise.all([crypto.subtle.exportKey('raw',kp.publicKey),crypto.subtle.exportKey('jwk',kp.privateKey)]).then(function(r){
      var o={pub:b64u(r[0]),jwk:r[1]};LS.set('la_vapid',o);return {pub:o.pub,key:kp.privateKey};
    });
  });
}
function vapidAuth(ep){
  return vapid().then(function(v){
    var aud=new URL(ep).origin,sub=/^https:/.test(location.origin)?location.origin:'mailto:kani-study@example.com';
    var h=b64u(te.encode(JSON.stringify({typ:'JWT',alg:'ES256'}))),c=b64u(te.encode(JSON.stringify({aud:aud,exp:Math.floor(Date.now()/1000)+12*3600,sub:sub})));
    return crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},v.key,te.encode(h+'.'+c)).then(function(sig){return 'vapid t='+h+'.'+c+'.'+b64u(sig)+', k='+v.pub;});
  });
}
// RFC 8291（aes128gcm）で通知の中身を暗号化
function encryptPush(sub,text){
  var j=sub.toJSON?sub.toJSON():sub,ua=ub64u(j.keys.p256dh),auth=ub64u(j.keys.auth),kp,asPub,ikm,salt=crypto.getRandomValues(new Uint8Array(16));
  return crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveBits']).then(function(k){kp=k;return crypto.subtle.exportKey('raw',k.publicKey);})
    .then(function(r){asPub=new Uint8Array(r);return crypto.subtle.importKey('raw',ua,{name:'ECDH',namedCurve:'P-256'},false,[]);})
    .then(function(uk){return crypto.subtle.deriveBits({name:'ECDH',public:uk},kp.privateKey,256);})
    .then(function(sh){return hkdf(auth,new Uint8Array(sh),cat(te.encode('WebPush: info\0'),ua,asPub),32);})
    .then(function(x){ikm=x;return Promise.all([hkdf(salt,ikm,te.encode('Content-Encoding: aes128gcm\0'),16),hkdf(salt,ikm,te.encode('Content-Encoding: nonce\0'),12)]);})
    .then(function(r){return crypto.subtle.importKey('raw',r[0],'AES-GCM',false,['encrypt']).then(function(key){return crypto.subtle.encrypt({name:'AES-GCM',iv:r[1]},key,cat(te.encode(text),new Uint8Array([2])));});})
    .then(function(ct){return b64(cat(salt,new Uint8Array([0,0,16,0]),new Uint8Array([65]),asPub,new Uint8Array(ct)));});
}
function pushMsg(sub,o){
  return Promise.all([encryptPush(sub,JSON.stringify(o)),vapidAuth(sub.endpoint)]).then(function(r){return {at:o.at||0,b:r[0],a:r[1]};});
}
function swReg(){
  if(!pushOk())return Promise.reject(new Error('この画面では通知を使えません'));
  return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});
}
function curSub(){if(!pushOk())return Promise.resolve(null);return navigator.serviceWorker.getRegistration().then(function(r){return r?r.pushManager.getSubscription():null;}).catch(function(){return null;});}
function devId(){var d=LS.get('la_dev','');if(!d){d=uid();LS.set('la_dev',d);}return d;}
function pushState(){
  if(!pushOk())return isStandalone()?'unsupported':'browser';
  if(Notification.permission==='denied')return 'denied';
  return SET.push&&Notification.permission==='granted'?'on':'off';
}
A.pushOn=function(){
  if(!pushOk()){toast(isStandalone()?'このiPhoneでは通知を使えません（iOS 16.4以降が必要です）':'ホーム画面に追加したアプリから、オンにしてください',5000);return;}
  var p=Notification.requestPermission();
  (p&&p.then?p:Promise.resolve(Notification.permission)).then(function(perm){
    if(perm!=='granted')throw new Error('通知が許可されませんでした。iPhoneの設定アプリから、このアプリの通知を許可してください');
    return swReg();
  }).then(function(reg){
    return vapid().then(function(v){
      return reg.pushManager.getSubscription().then(function(old){return old?old.unsubscribe():null;}).then(function(){
        return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64u(v.pub)});
      });
    });
  }).then(function(){SET.push=1;saveSet();LAST_SIG='';pushSchedule();toast('通知をオンにしました',3000);if(sheetOpen())A.settings();})
  .catch(function(e){var m=(e&&e.message)||'';if(/register|script|fetch|404|Service ?Worker/i.test(m))m='通知用のファイル「sw.js」が読み込めません。GitHubで index.html と同じ場所に sw.js があるか確認してください';toast(m||'通知をオンにできませんでした',8000);LS.set('la_pusherr',m);});
};
A.pushOff=function(){
  SET.push=0;saveSet();
  curSub().then(function(s){if(s)s.unsubscribe();});
  api('alarmClear',{dev:devId()}).catch(function(){});
  toast('通知をオフにしました');if(sheetOpen())A.settings();
};

  }).then(function(r){toast(r.code>=200&&r.code<300?'テスト通知を送りました。数秒で届きます':'送信できませんでした（応答 '+r.code+'）',5000);},function(e){if(e.message!=='busy')toast(e.message,5000);});

function upcoming(){

    if(b>0)ev.push({at:TM.end+b*60e3,t:'休憩おわり',b:TM.plan?'アプリを開いて、次のステップを始めましょう':'アプリを開いて、次の勉強を始めましょう',g:'kani-timer'});

var LAST_SIG='',pT=0,pChain=Promise.resolve();
function pushSchedule(){clearTimeout(pT);pT=setTimeout(pushRun,400);}
function pushRun(){
  if(pushState()!=='on'||!S.key)return;
  var ev=upcoming(),sig=ev.map(function(e){return e.at+e.t;}).join('|');
  if(sig===LAST_SIG)return;LAST_SIG=sig;
  pChain=pChain.then(function(){
    return curSub().then(function(s){
      if(!s)return;
      if(!ev.length)return api('alarmClear',{dev:devId()});
      return Promise.all(ev.map(function(e){return pushMsg(s,e);})).then(function(list){return api('alarmSet',{dev:devId(),ep:s.endpoint,list:list});});
    });
  }).then(function(){LS.set('la_pusherr','');},function(e){LAST_SIG='';setSync('err');S.lastErr=e.message;LS.set('la_pusherr',(e&&e.message)||'通知の予約に失敗しました');});
}

/* =====================================================
   料理モデル（教材ベース）
   目次（cat）＝本の見出し。読んだ記録（note）と調理の記録（cook）が、目次の項目（u）につながる
   ===================================================== */
function cooks(){return rows('cook').slice().sort(function(a,b){return (b.d+(b.id||''))>(a.d+(a.id||''))?1:-1;});}
function notes(){return rows('note').slice().sort(function(a,b){return (b.d+(b.id||''))>(a.d+(a.id||''))?1:-1;});}
function cooksOf(id){return cooks().filter(function(c){return c.u===id;});}
function notesOf(id){return notes().filter(function(n){return n.u===id;});}
function tocRow(id){return cols('toc').filter(function(t){return t.id===id;})[0]||null;}
/* 目次の項目（見出しの下に項目がないもの）を、本の順番で */
function tocLeaves(){var o=[];(function walk(p){kids(p).forEach(function(c){var k=kids(c.id);if(k.length)walk(c.id);else o.push(c);});})('');return o;}
function isRead(id){var t=tocRow(id);return !!((t&&t.ok)||notesOf(id).length);}
function isTried(id){return cooksOf(id).length>0;}
function stOf(id){return isTried(id)?2:isRead(id)?1:0;}
var TST=[['これから','gray'],['読んだ',''],['作った','ok']];
function stChip(id){var s=TST[stOf(id)];return '<span class="chip '+s[1]+'">'+s[0]+'</span>';}
function stMark(id){var s=stOf(id);return '<span class="mk m'+s+'" style="--c:'+colorOfCat(id)+'" aria-label="'+TST[s][0]+'">'+(s===2?ico('pot',13):s===1?ico('check',13):'')+'</span>';}
function mLegend(){return '<div class="mlegend">'+TST.map(function(x,i){return '<span><span class="mk m'+i+'">'+(i===2?ico('pot',13):i===1?ico('check',13):'')+'</span>'+x[0]+'</span>';}).join('')+'</div>';}
function nextItem(){var l=tocLeaves();return l.filter(function(c){return !isRead(c.id);})[0]||null;}
function dishes(){return uniq(cooks().map(function(c){return c.dish;}).filter(Boolean));}
function favs(){
  var by={};cooks().forEach(function(c){if(!c.dish)return;by[c.dish]=by[c.dish]||{n:0,r:0,rn:0,f:0};by[c.dish].n++;if(c.rate){by[c.dish].r+=+c.rate;by[c.dish].rn++;}if(c.fav)by[c.dish].f=1;});
  return Object.keys(by).filter(function(k){var x=by[k];return x.f||(x.n>=3&&x.rn&&x.r/x.rn>=4);}).map(function(k){return {dish:k,n:by[k].n,avg:by[k].rn?Math.round(by[k].r/by[k].rn*10)/10:null};});

var TONES=[['bell','鈴'],['marimba','木琴'],['chime','チャイム'],['soft','やさしい']];
function toneOut(kind){
  var tone=SET.tone||'bell',n=kind==='warn'?1:3,rounds=kind==='warn'?1:3,base=kind==='break'?660:880;
  var pat={bell:{w:'sine',f:[1,1.5,2],d:.9,g:.5},marimba:{w:'triangle',f:[1,1.25,1.5],d:.35,g:.55},chime:{w:'sine',f:[1.5,1.25,1],d:1.2,g:.45},soft:{w:'sine',f:[.75,.75,.75],d:.6,g:.3}}[tone]||{w:'sine',f:[1,1,1],d:.35,g:.5};
  for(var r=0;r<rounds;r++)for(var i=0;i<n;i++){
    var o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+.05+r*1.75+i*.42;
    o.type=pat.w;o.frequency.value=base*pat.f[i%3];o2.type='sine';o2.frequency.value=base*pat.f[i%3]*2;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(pat.g,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+pat.d);
    var g2=ac.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(ac.destination);
    o.start(t0);o2.start(t0);o.stop(t0+pat.d+.05);o2.stop(t0+pat.d+.05);
  }
}

  }catch(e){}}

  if(kind!=='warn')setTimeout(burst,60);
}

var GM=null,GMT=0;
function gmBlank(){return {c:0,fresh:1,lg:'',rd:'',gw:'',dq:'',st:{},fd:{},qz:{},sp:{},own:[],of:[],cab:'',sea:0,t:0};}
function gmInit(server){
  var loc=LS.get('la_gm',null);
  GM=(server&&(!loc||(server.t||0)>=(loc.t||0)))?server:(loc||server||gmBlank());
  ['st','fd','qz','sp'].forEach(function(k){if(!GM[k])GM[k]={};});['own','of'].forEach(function(k){if(!GM[k])GM[k]=[];});
  if(GM.c==null)GM.c=3;
  if(loc&&server&&(loc.t||0)>(server.t||0))gmSave(1);
}
function gmSave(now){
  if(!GM)return;GM.t=Date.now();
  while(JSON.stringify(GM).length>7600&&GM.own.length)GM.own.pop();
  LS.set('la_gm',GM);clearTimeout(GMT);
  GMT=setTimeout(function(){if(!S.key)return;api('gameSave',{gm:GM}).catch(function(){});},now?50:1200);
}
function gmAdd(n,why){
  if(!GM)return;GM.c=Math.min(99,(GM.c||0)+n);gmSave();
  coinToast('+'+n,why);var e=document.getElementById('arcCoins');if(e){e.textContent=GM.c;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump');}
  var m=document.getElementById('arcMiniC');if(m)m.textContent=GM.c;
}
function coinToast(n,why){
  var t=document.createElement('div');t.className='ctoast';t.innerHTML='<span class="kcoin">K</span><b>'+n+'</b><span>'+esc(why)+'</span>';document.body.appendChild(t);
  setTimeout(function(){t.classList.add('out');},2200);setTimeout(function(){t.remove();},2700);
}

function gmLogin(){
  if(!GM)return;var t=today();
  if(GM.fresh){delete GM.fresh;GM.lg=t;setTimeout(function(){gmAdd(10,'はじめてのボーナス');},1900);return;}
  if(GM.lg!==t){GM.lg=t;setTimeout(function(){gmAdd(1,'ログインボーナス');},1900);}
  (S.friends||[]).forEach(function(f){var g=f.g;if(g&&g.h&&(g.me||0)+(g.fr||0)>=g.h*60&&GM.gw!==g.ws){GM.gw=g.ws;setTimeout(function(){gmAdd(3,'共通目標を達成');},2600);}});
}

  var rot=seen?(Math.random()-.5)*.6:0,sc=.78;
  var pts=c.s.map(function(p){var x=(p[0]-50)*sc,y=(p[1]-50)*sc,cs=Math.cos(rot),sn=Math.sin(rot);return {x:50+x*cs-y*sn,y:50+x*sn+y*cs,r:p[2]*.55,real:1};});

  '<h3>毎日の使い方（学習モデル）</h3><ol><li>ホームの大きなボタンか、タイマーで時間やセットを押す（押した瞬間に始まります）</li><li>終わると時間が記録され、休憩に切り替わる（途中でやめるときは「終了」を長押し。休憩中に次の時間も選べます）</li><li>セットが全部終わったら「何を勉強した？」が出るので、目次から選んで理解度を入れる。あとで登録してもOK（ホームに未登録の件数が出ます）</li><li>分析の「レポート」で、今日・今月・累計と、章ごとの時間を見る</li></ol><p>通知音の種類と文字の大きさは、設定の「この端末の設定」で変えられます。右上の丸を押すと、保存の状態が分かります。</p><p><b>セット</b>は「勉強25分→休憩5分→勉強25分」のような組み合わせです。タイマーの「編集」から作れます。</p><p>小テストは、間違えた問題や理解度の低い科目から優先して出ます。</p>'+
  '<h3>フレンドと応援</h3><p>設定の招待リンクを送ると、相手はリンクを開いてホーム画面に追加し、アカウントを作るだけでフレンドになります。フレンドのプロジェクトは閲覧のみです。</p><ul>'+
  '<li><b>いま勉強中</b>：タイマーで勉強しているあいだ、フレンドのプロジェクト画面に「いま勉強中」と残り時間が出ます。休憩・一時停止・終了で消えます。「がんばれ」を押すと応援が届きます。</li>'+
  '<li><b>応援スタンプとひとこと</b>：「フレンドの最近の活動」の記録ごとに、スタンプか30字までのひとことを送れます。届いた応援は、自分のプロジェクトのホームの下に出ます。</li>'+
  '<li><b>2人の共通目標</b>：フレンドごとに「今週2人で合計○時間」を決められます。学習の記録と料理の調理時間を合計し、月曜に0から始まります。どちらからでも変更できます。</li>'+
  '<li><b>プロフィール画像</b>：設定のプロフィールに、Googleドライブの写真の共有リンクを貼ります。共有は「リンクを知っている全員」にしてください。</li></ul>'+
  '<h3>着せ替え</h3><p>着せ替えタブで、この端末の見た目を変えられます。絵のある着せ替え（星空の図書館・ひだまりの台所・海辺のカニ・いぬとねこ）は、イラストが追加されると自動で本番の絵に切り替わります。</p>'+
  '<h3>記録は14日で閲覧のみに</h3><p>学習記録・小テストの結果・調理記録・知識の学習記録は、14日を過ぎるとGoogleドライブへ自動で退避されます。グラフや履歴には残りますが、編集や削除はできなくなります。記録するときは、14日以内の日付を選んでください。</p>'+
  '<h3>タイマーとアラーム</h3><p>勉強が終わると自動で記録し、休憩に切り替わります。途中で終えた場合は、実際に学んだ分だけ記録します。休憩は学習時間に含めません。</p><p>アプリを開いている間は、終わったときに音とバナーでお知らせします。</p><p><b>iPhoneの通知</b>：設定の「通知をオンにする」を押して許可すると、画面をロックしていても終了が通知で届きます（iOS 16.4以降、ホーム画面に追加したアプリのみ）。サーバーが1分おきに確認するため、最大1分ほど遅れることがあります。</p><p>通知が使えないときは、iPhoneの「ショートカット」と連携して、時計アプリのタイマーを同時にセットする方法もあります。</p>'+
  '<ol><li>「ショートカット」アプリで、新しいショートカットを作る</li><li>アクション「入力から数字を取得」を追加する（表記はiOSのバージョンで少し違うことがあります）</li><li>アクション「タイマーを開始」を追加し、時間を「数字」の分にする</li><li>名前を「学習タイマー」にする</li><li>このアプリの設定で「iPhoneのタイマーも同時にセット」をオンにする</li></ol><p>開始ボタンを押すと、ショートカットが開いてiPhoneのタイマーがセットされます。終わったら、このアプリに戻ってください。</p>'+
  '<h3>料理モデルの進め方</h3><p>ホームの「次に読む」から1項目読んで「読んだ」を押し、分かったことを自分の言葉で残します。その知識を使って作ったら「作ってみた」で調理を記録します。目次タブで、項目ごとに「未読・読んだ・作ってみた」が分かります。</p><p>写真は、Googleドライブに入れて共有を「リンクを知っている全員」にし、そのリンクを貼ります。</p>'+
  '<h3>機種変更</h3><p>今の端末の設定で「引き継ぎコード」を発行し、新しい端末の作成画面で入力します。端末をなくした場合は、管理者に発行してもらえます。</p>'+
  '<h3>表示がおかしいとき</h3><p>設定の「表示を最新にする」を押すと、この端末に残っている古い表示を消して読み込み直します。</p>'+
  '<h3>ご意見ボックス</h3><p>ほしい機能や不具合は、ご意見タブから送ってください。対応状況もそこで確認できます。</p></div>');
};
